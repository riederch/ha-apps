---
name: Cloudflared Origin Auth
version: "7.0.13-rch3"
slug: cloudflared_auth
description: >-
  Cloudflare Tunnel for Home Assistant with per-origin Basic or Bearer
  authentication for additional hosts
url: "https://github.com/riederch/ha-apps/tree/main/cloudflared_auth"
startup: services
init: false
hassio_api: true
arch:
  - aarch64
  - amd64
map:
  - type: app_config
    read_only: false
  - type: homeassistant_config
    read_only: true
options:
  external_hostname: ""
  additional_hosts: []
ports:
  36500/tcp: null
schema:
  external_hostname: str?
  additional_hosts:
    - hostname: str
      service: str
      disableChunkedEncoding: bool?
      basic_auth_username: str?
      basic_auth_password: password?
      bearer_token: password?
  tunnel_name: str?
  catch_all_service: str?
  nginx_proxy_manager: bool?
  tunnel_token: str?
  post_quantum: bool?
  run_parameters:
    - match(^(--edge-bind-address|--edge-ip-version|--grace-period|--ha-connections|--logfile|--loglevel|--pidfile|--protocol|--region|--retries|--tag)=.*$)?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?

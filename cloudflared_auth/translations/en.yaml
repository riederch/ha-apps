---
configuration:
  log_level:
    name: Log level
    description: >-
      Defines the log level for the app.
  external_hostname:
    name: External Home Assistant hostname
    description: >-
      Domain name or subdomain used to access Home Assistant through the
      Cloudflare Tunnel.
  tunnel_name:
    name: Cloudflare Tunnel name
    description: >-
      Name of the locally managed Cloudflare Tunnel. The default value is
      suitable for most installations.
  additional_hosts:
    name: Additional hosts
    description: >-
      Additional hostnames routed through the Cloudflare Tunnel. Authentication
      is optional per host. Use either a Bearer token or both Basic Auth fields,
      never both authentication methods at the same time.
    fields:
      hostname:
        name: Hostname
        description: >-
          Public hostname to expose through the Cloudflare Tunnel, for example
          api.example.com.
      service:
        name: Origin service
        description: >-
          Internal service URL, for example http://192.168.1.20:8080. For
          authenticated hosts, use an http:// or https:// URL without a path.
      disableChunkedEncoding:
        name: Disable chunked encoding
        description: >-
          Disables HTTP chunked transfer encoding for this origin request.
      basic_auth_username:
        name: Basic Auth username
        description: >-
          Username sent to the origin using HTTP Basic Authentication. Leave
          empty unless Basic Authentication is required.
      basic_auth_password:
        name: Basic Auth password
        description: >-
          Password sent to the origin using HTTP Basic Authentication. Both
          username and password are required for Basic Authentication.
      bearer_token:
        name: Bearer token
        description: >-
          Token sent to the origin as an Authorization: Bearer header. Leave
          empty when no Bearer authentication is required.
  post_quantum:
    name: Use post-quantum cryptography
    description: >-
      Makes the tunnel use post-quantum cryptography. This also restricts the
      tunnel to QUIC and can cause connectivity issues in some environments.
  run_parameters:
    name: Additional Cloudflared parameters
    description: >-
      Optional additional command-line parameters passed to Cloudflared.
  catch_all_service:
    name: Catch-all service
    description: >-
      Service URL used for requests that do not match a configured hostname.
  nginx_proxy_manager:
    name: Enable Nginx Proxy Manager catch-all
    description: >-
      Uses the Nginx Proxy Manager Home Assistant app as the catch-all service.
  tunnel_token:
    name: Cloudflare Tunnel token
    description: >-
      Token for a remotely managed Cloudflare Tunnel. When this is set,
      Cloudflare remote management is used and the local ingress options,
      including additional host authentication, are ignored.
network:
  36500/tcp: Metrics web interface (36500/tcp)

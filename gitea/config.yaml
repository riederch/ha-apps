name: Gitea
version: "1.27.1"
slug: gitea
description: Self-hosted Git hosting with web UI, SSH and persistent repositories for Home Assistant OS
url: https://github.com/riederch/ha-apps/tree/main/gitea
arch:
  - aarch64
  - amd64
image: ghcr.io/alexbelgium/gitea-{arch}
init: false
startup: services
boot: auto
map:
  - addon_config:rw
  - share:rw
  - ssl:rw
ports:
  22/tcp: 2222
  3000/tcp: 3000
ports_description:
  22/tcp: Git over SSH
  3000/tcp: Web interface
webui: "[PROTO:ssl]://[HOST]:[PORT:3000]"
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  APP_NAME: Gitea for Home Assistant
  DOMAIN: homeassistant.local
  ROOT_URL: ""
  env_vars: []
schema:
  ssl: bool
  certfile: str
  keyfile: str
  APP_NAME: str?
  DOMAIN: str?
  ROOT_URL: str?
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
udev: true

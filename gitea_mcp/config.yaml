name: Gitea MCP
version: "1.7.0-rch1"
slug: gitea_mcp
description: Thin Home Assistant wrapper for the official Gitea MCP server with per-request bearer-token forwarding
url: https://github.com/riederch/ha-apps/tree/main/gitea_mcp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: MCP Streamable HTTP endpoint
options:
  gitea_host: http://homeassistant.local:3000
  insecure: false
  read_only: false
  debug: false
schema:
  gitea_host: url
  insecure: bool
  read_only: bool
  debug: bool
watchdog: tcp://[HOST]:[PORT:8080]

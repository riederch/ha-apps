name: Gitea MCP
version: "0.2.1"
slug: gitea_mcp
description: Model Context Protocol server that exposes a Gitea instance to tools such as ChatGPT
url: https://github.com/riederch/ha-apps/tree/main/gitea_mcp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: MCP Streamable HTTP endpoint
options:
  gitea_host: http://homeassistant.local:3000
  insecure: false
  debug: false
schema:
  gitea_host: url
  insecure: bool
  debug: bool
watchdog: tcp://[HOST]:[PORT:8080]

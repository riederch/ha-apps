name: Local EMS tests

on:
  pull_request:
    paths:
      - "custom_components/local_ems/**"
      - "tests/test_local_ems_*.py"
      - "tests/test-local-ems-*.mjs"
      - ".github/workflows/local-ems-tests.yml"
  push:
    paths:
      - "custom_components/local_ems/**"
      - "tests/test_local_ems_*.py"
      - "tests/test-local-ems-*.mjs"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile integration files
        run: python -m compileall -q custom_components/local_ems
      - name: Run pure calculation tests
        run: python -m unittest discover -s tests -p 'test_local_ems_*.py' -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify custom card JavaScript
        run: |
          node --check custom_components/local_ems/frontend/local-ems-flow-card.mjs
          node --check custom_components/local_ems/frontend/pfcp-adapter.mjs
          node --check custom_components/local_ems/frontend/vendor/power-flow-card-plus-v0.3.7.mjs
          node --check custom_components/local_ems/frontend/flow-model.mjs
          node --check custom_components/local_ems/frontend/energy-preferences.mjs
          node --check custom_components/local_ems/frontend/peak-gauge-model.mjs
          node --check custom_components/local_ems/frontend/local-ems-peak-gauge-card.mjs
      - name: Run energy-flow unit tests
        run: node --test tests/test-local-ems-flow.mjs tests/test-local-ems-peak-gauge.mjs

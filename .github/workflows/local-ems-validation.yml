name: Local EMS integration validation

on:
  pull_request:
    paths:
      - "custom_components/local_ems/**"
      - "hacs.json"
      - "docs/local-ems.md"
      - ".github/workflows/local-ems-validation.yml"
  push:
    paths:
      - "custom_components/local_ems/**"
      - "hacs.json"
      - ".github/workflows/local-ems-validation.yml"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS repository validation
        uses: hacs/action@main
        with:
          category: integration

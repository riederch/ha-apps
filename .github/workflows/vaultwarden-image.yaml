---
name: Vaultwarden image

on:
  pull_request:
    paths:
      - "vaultwarden/**"
      - ".github/workflows/vaultwarden-image.yaml"
  push:
    branches:
      - main
    paths:
      - "vaultwarden/**"
      - ".github/workflows/vaultwarden-image.yaml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the versioned Vaultwarden image and latest tag from main"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Assert release-policy safety and negative cases
        shell: bash
        run: python3 -m unittest discover -s vaultwarden/tests -p test_publish_policy.py -v

      - name: Check Vaultwarden update consistency
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(awk -F '[:"]' '/^FROM "vaultwarden\/server:/{print $3}' vaultwarden/Dockerfile)"
          backup_version="$(awk -F'"' '/local migration_version=/{print $2}' vaultwarden/rootfs/etc/s6-overlay/s6-rc.d/vaultwarden/run)"
          test -n "$runtime_version" && test "$runtime_version" = "$backup_version"
          bash -n vaultwarden/rootfs/etc/s6-overlay/s6-rc.d/vaultwarden/run
      - name: Exercise SQLite rollback snapshot and corruption handling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y sqlite3
          fi
          bash vaultwarden/tests/test_backup.sh
      - name: Read app metadata
        id: meta
        shell: bash
        run: |
          version="$(awk '$1 == "version:" { print $2; exit }' vaultwarden/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "Unable to read Vaultwarden app version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and validate Vaultwarden (no publishing)
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./vaultwarden
          file: ./vaultwarden/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ghcr.io/riederch/ha-apps-vaultwarden:${{ steps.meta.outputs.version }}
            ghcr.io/riederch/ha-apps-vaultwarden:latest
          build-args: |
            BUILD_ARCH=multiarch
            BUILD_DATE=${{ steps.meta.outputs.date }}
            BUILD_DESCRIPTION=Open source password management solution
            BUILD_NAME=Vaultwarden
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishing must be an independent operator action from the default
  # branch, after the full build job passes. The named environment may be
  # configured with required reviewers under Settings > Environments.
  publish:
    name: publish-vaultwarden
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    environment: vaultwarden-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v7.0.1
      - name: Refuse non-default branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Read release version and metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" { print $2; exit }' vaultwarden/config.yaml)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Refusing to publish an invalid Vaultwarden app version" >&2
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GHCR for explicit release
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Vaultwarden multi-arch release
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./vaultwarden
          file: ./vaultwarden/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/riederch/ha-apps-vaultwarden:${{ steps.meta.outputs.version }}
            ghcr.io/riederch/ha-apps-vaultwarden:latest
          build-args: |
            BUILD_ARCH=multiarch
            BUILD_DATE=${{ steps.meta.outputs.date }}
            BUILD_DESCRIPTION=Open source password management solution
            BUILD_NAME=Vaultwarden
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image digest
        shell: bash
        run: |
          echo "Published version: ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
